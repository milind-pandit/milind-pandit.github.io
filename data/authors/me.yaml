bio: |
  Milind Pandit is an R&D Engineer at IMEC in Leuven, Belgium, working on novel
  micro sensor and actuator technologies with applications in health and
  wearables. He is currently developing a piezoelectric micromachined ultrasound
  transducer (pMUT) platform for ultrasound-based neural stimulation. He received
  his PhD in Microsystems Engineering from the University of Cambridge, and
  previously worked on flexible pMUTs for cardiac monitoring at Pulsify Medical
  and on high-resolution MEMS gravimeters at Silicon Microgravity.

