    summary: |
      Thesis: *Towards ultra-high resolution mode-localised MEMS sensors*. Supervisor: Prof. Ashwin Seshia.
      Investigated MEMS coupled resonators for high-resolution, temperature-insensitive gravimetric applications,
      and researched fundamental resonator limits of drift, nonlinearity, noise, and resolution.
  - degree: BASc (with Distinction) in Electrical and Computer Engineering
    institution: University of British Columbia
    start: 2011-09-01
    end: 2015-05-31
    summary: |
      Bachelor's thesis on artificial muscle technology based on coiled nylon for prosthetic and medical use.
      International Leader of Tomorrow Award.

experience:
  - role: R&D Engineer
    org: IMEC
    start: 2025-01-01
    summary: |
      Leuven, Belgium.
      - Leading development of pMUTs for neurostimulation, characterizing and benchmarking PZT and AlScN technologies.
      - Led design and integration of a pMUT-based cuff for gesture recognition in a funded project.
      - Evaluated cMUT viability for cardiac health monitoring for a new startup (FEM simulations, electrical and acoustic measurements).
      - Mentoring master's and doctoral students in MUT research.
  - role: Senior MEMS Development Engineer
    org: Pulsify Medical
    start: 2021-01-01
    end: 2025-01-01
    summary: |
      Leuven, Belgium.
      - Contributed to the EU-funded Listen2future project advancing flexible, high-frequency pMUTs for medical applications.
      - Coordinated technology transfer from an R&D line to a commercial foundry for a first-of-a-kind large-area piezo-on-glass process.
      - Led MEMS simulation, design, process development, and characterization of flexible ultrasound cardiac monitoring patches.
  - role: MEMS Design and Analytics Engineer
    org: Silicon Microgravity
    start: 2019-10-01
    end: 2021-01-01
    summary: |
      Cambridge, UK.
      - Led the surface gravimeter team to create a first-of-a-kind field prototype for underground cavity detection.
      - Improved MEMS accelerometer resolution by 50x through system design optimization, testing, and machine-learning-based calibration.

