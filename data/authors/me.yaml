experience:
  - role: R&D Engineer
    org: IMEC
    start: 2025-10-01
    summary: |
      Leuven, Belgium.
      - Leading development of pMUTs for neurostimulation, characterizing and benchmarking PZT and AlScN technologies, resulting in feasibility-study intakes from technology companies and startups.
      - Integrated pMUTs in a cuff for gesture recognition through electrical characterization, system analysis, and CAD design.
      - Mentoring master's and doctoral students in MUT research, leading to several co-authored papers.
  - role: R&D Project Leader
    org: IMEC
    start: 2025-04-01
    end: 2025-10-01
    summary: |
      Leuven, Belgium.
      - Evaluated the viability of cMUTs for cardiac health monitoring for a new startup, working with investors, technology experts and foundries, and performing FEM simulations and electrical and acoustic measurements.
  - role: Senior MEMS Development Engineer
    org: Pulsify Medical
    start: 2023-10-01
    end: 2025-04-01
    summary: |
      Leuven, Belgium.
      - Led interactions with IMEC, foundries, and consultants for MEMS simulation and design, process development, and characterization of flexible piezoelectric ultrasound cardiac monitoring patches.
      - Coordinated technology transfer from an R&D line to a commercial foundry to qualify and validate a first-of-a-kind large-area piezo-on-glass process.
  - role: MEMS Design Engineer
    org: Pulsify Medical
    start: 2021-08-01
    end: 2023-09-01
    summary: |
      Leuven, Belgium.
      - Initiated design and test procedures for electrical, optical and acoustic characterization of MEMS ultrasound transducers, leading to FMEA and QRM for product integration.
      - Led EU projects (including Listen2future) to advance flexible, high-frequency pMUTs for medical applications, optimizing designs through finite element modeling for efficiency, bandwidth, and frequency response.
  - role: MEMS Design and Analytics Engineer
    org: Silicon Microgravity
    start: 2019-10-01
    end: 2021-07-01
    summary: |
      Cambridge, UK.
      - Led the surface gravimeter team to create a first-of-a-kind field prototype for underground cavity detection.
      - Improved MEMS accelerometer resolution by 50x through system design optimization, experimental testing, and machine-learning-based calibration, reducing environmental noise pickup and temperature-induced drift.
  - role: PhD Researcher – Inertial Sensing and Resonator Dynamics
    org: Silicon Microgravity
    start: 2015-10-01
    end: 2019-10-01
    summary: |
      Cambridge, UK.
      - Optimized coupled resonator dynamics through finite element modeling and validated results with custom experimental setups featuring temperature control and low-noise electronics.

